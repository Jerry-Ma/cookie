[build-system]
{%- if cookiecutter.backend == "pdm" %}
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"
{%- elif cookiecutter.backend == "uv" %}
requires = ["uv_build>=0.7.19,<0.12"]
build-backend = "uv_build"
{%- elif cookiecutter.backend == "maturin" %}
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"
{%- elif cookiecutter.backend == "hatch" %}
{%- if cookiecutter.vcs %}
requires = ["hatchling>=1.26", "hatch-vcs"]
{%- else %}
requires = ["hatchling>=1.26"]
{%- endif %}
build-backend = "hatchling.build"
{%- elif cookiecutter.backend == "setuptools" %}
{%- if cookiecutter.vcs %}
requires = ["setuptools>=84.0", "setuptools_scm[toml]>=10.3"]
{%- else %}
requires = ["setuptools>=77"]
{%- endif %}
build-backend = "setuptools.build_meta"
{%- elif cookiecutter.backend == "flit" %}
{%- if cookiecutter.vcs %}
requires = ["flit_scm", "flit_core>=3.11"]
build-backend = "flit_scm:buildapi"
{%- else %}
requires = ["flit_core>=3.11"]
build-backend = "flit_core.buildapi"
{%- endif %}
{%- elif cookiecutter.backend == "pybind11" %}
{%- if cookiecutter.vcs %}
requires = ["setuptools>=77", "setuptools_scm[toml]>=7", "pybind11"]
{%- else %}
requires = ["setuptools>=77", "pybind11"]
{%- endif %}
build-backend = "setuptools.build_meta"
{%- elif cookiecutter.backend == "skbuild"  %}
requires = ["pybind11", "scikit-build-core>=0.12"]
build-backend = "scikit_build_core.build"
{%- elif cookiecutter.backend == "mesonpy" %}
requires = ["meson-python>=0.18", "pybind11"]
build-backend = "mesonpy"
{%- elif cookiecutter.backend == "poetry" %}
{%- if cookiecutter.vcs %}
requires = ["poetry-core>=2.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
{%- else %}
requires = ["poetry_core>=2.0"]
build-backend = "poetry.core.masonry.api"
{%- endif %}
{%- endif %}


[project]
name = "{{ cookiecutter.project_name }}"
{%- if cookiecutter.backend in ['maturin', 'mesonpy', 'uv'] or not cookiecutter.vcs and cookiecutter.backend in ['setuptools', 'pybind11', 'skbuild', 'poetry'] %}
version = "0.1.0"
{%- endif %}
authors = [
  { name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" },
]
{%- if cookiecutter.org | lower == "scikit-hep" %}
maintainers = [
  { name = "The Scikit-HEP admins", email = "scikit-hep-admins@googlegroups.com" },
]
{%- endif %}
description = "{{ cookiecutter.project_short_description }}"
readme = "README.md"
{%- if cookiecutter.backend != 'poetry' %}
{%- if cookiecutter.license == "BSD" %}
license = "BSD-3-Clause"
{%- elif cookiecutter.license == "Apache" %}
license = "Apache-2.0"
{%- elif cookiecutter.license == "MIT" %}
license = "MIT"
{%- endif %}
license-files = ["LICENSE"]
{%- endif %}
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
{%- if cookiecutter.backend == ['poetry'] %}
{%- if cookiecutter.license == "BSD" %}
  "License :: OSI Approved :: BSD License",
{%- elif cookiecutter.license == "Apache" %}
  "License :: OSI Approved :: Apache Software License",
{%- elif cookiecutter.license == "MIT" %}
  "License :: OSI Approved :: MIT License",
{%- endif %}
{%- endif %}
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
{%- if cookiecutter.backend not in ['maturin', 'mesonpy', 'uv'] and cookiecutter.vcs or cookiecutter.backend in ['pdm', 'hatch', 'flit'] %}
dynamic = ["version"]
{%- endif %}
dependencies = [
  "typer",
]

[project.urls]
Homepage = "{{ cookiecutter.url }}"
"Bug Tracker" = "{{ cookiecutter.url }}/issues"
Discussions = "{{ cookiecutter.url }}/discussions"
Changelog = "{{ cookiecutter.url }}/releases"
Documentation = "https://{{ cookiecutter.org | lower }}.github.io/{{ cookiecutter.project_name }}/"

[project.scripts]
{{ cookiecutter.project_name }} = "{{ cookiecutter.__project_slug }}.cli:app"


[dependency-groups]
test = [
  "pytest >=9.1",
  "pytest-cov >=7.1",
  "pytest-doctestplus",
  "pytest-benchmark",
]
dev = [
  { include-group = "test" },
  "pandas-stubs",  # pandas has no type information of its own
]
{%- if cookiecutter.docs == 'sphinx' %}
docs = [
  "sphinx>=9.1",
  "myst_parser>=5.1",
  "sphinx_copybutton",
  "sphinx-astropy[confv2]",
  "sphinx_book_theme",
  "autodoc_pydantic",
  "sphinxcontrib-typer",
]
{%- elif cookiecutter.docs == "properdocs" %}
docs = [
    "markdown>=3.9",
    "mdx-include>=1.4.2",
    "mkdocs-material>=9.1.19",
    "mkdocstrings-python>=1.18.2",
    "properdocs>=1.6.7",
    "pyyaml>=6.0.1",
]
{%- elif cookiecutter.docs == "zensical" %}
docs = [
    "zensical>=0.0.20",
]
{%- endif %}


{%- if cookiecutter.backend == "skbuild" %}


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
{%- if cookiecutter.vcs %}
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/{{ cookiecutter.__project_slug }}/_version.py"]
{%- endif %}


{%- elif cookiecutter.backend == "maturin" %}


[tool.maturin]
module-name = "{{ cookiecutter.__project_slug }}._core"
python-source = "src"
sdist-generator = "git"  # default is cargo

{%- elif cookiecutter.backend == "hatch" %}


[tool.hatch]
{%- if not cookiecutter.vcs %}
version.path = "src/{{ cookiecutter.__project_slug  }}/__init__.py"
{%- else %}
version.source = "vcs"
build.hooks.vcs.version-file = "src/{{ cookiecutter.__project_slug }}/_version.py"
{%- endif %}

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"

{%- elif cookiecutter.backend == "pdm" %}
{%- if cookiecutter.vcs %}


[tool.pdm.version]
source = "scm"
write_to = "{{ cookiecutter.__project_slug }}/_version.py"
write_template = "version = '{}'"

{%- else %}


[tool.pdm.version]
source = "file"
path = "src/{{ cookiecutter.__project_slug }}/__init__.py"

{%- endif %}

[tool.pdm.dev-dependencies]
devtest = ["pytest", "pytest-cov"]

{%- elif cookiecutter.backend == "poetry" %}
{%- if cookiecutter.vcs %}
[tool.poetry]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
substitution.files = ["src/{{ cookiecutter.__project_slug }}/__init__.py"]
{%- endif %}

[tool.poetry.group.test.dependencies]
pytest = ">= 9"
pytest-cov = ">= 7"
{%- endif %}


{%- if cookiecutter.backend in ["pybind11", "flit", "skbuild", "setuptools"] and cookiecutter.vcs %}


[tool.setuptools_scm]
write_to = "src/{{ cookiecutter.__project_slug }}/_version.py"

[tool.uv]
# Rebuild the project, and so read its version from git again, when a commit
# or a tag is added. Without this the installed version keeps its first value.
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

{%- endif %}


{%- if cookiecutter.__type == "compiled" %}


[tool.cibuildwheel]
test-command = "pytest {project}/tests"
test-extras = ["test"]
{%- endif %}


[tool.pytest]
minversion = "9.1"
addopts = ["-ra", "--showlocals", "--doctest-rst"]
strict = true
filterwarnings = [
  "error",
]
log_level = "INFO"
# pytest-doctestplus runs the `>>>` examples in docstrings and .rst pages.
# Markdown guides use testcode blocks instead; see `just doc-test`.
doctest_plus = "enabled"
testpaths = [
  "tests",
  "src/{{ cookiecutter.__project_slug }}",
  "docs",
]


[tool.coverage]
run.source = ["{{ cookiecutter.__project_slug }}"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.ty]
src.include = ["src", "tests"]
terminal.error-on-warning = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Trailing commas are the formatter's job
  "CPY001",  # No copyright notice in every file
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["{{ cookiecutter.__project_slug }}._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",        # Tests need no docstrings
  "INP001",   # tests/ is not a package
  "PLR2004",  # Literal values are fine in assertions
  "S101",     # pytest uses assert
  "T20",      # Printing is fine in tests
]
"docs/conf.py" = [
  "A001",    # Sphinx requires the name `copyright`
  "INP001",  # docs/ is not a package
]
{%- if cookiecutter.docs == "properdocs" %}
"docs/examples/**" = ["T20"]
{%- endif %}

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime, so the imports they use must stay real.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.numpydoc_validation]
# The hook reads the source only. It cannot see the constructor of a dataclass
# or a Pydantic model, or one a class inherits, and reports the documented
# parameters as unknown: mark such a class with `# numpydoc ignore=PR02`.
#
# Every check except these, each for the reason given.
checks = [
  "all",
  # Written where there is something to say, not on every object:
  "ES01",  # an extended summary
  "EX01",  # an Examples section
  "SA01",  # a See Also section
  # Ruff decides which objects need a docstring. This check also reports
  # overload stubs and nested functions.
  "GL08",
  # The hook reports it for every property. numpydoc's own validator does not
  # ask a property for a Returns section.
  "RT01",
  # Rejects any summary whose first word ends in one "s", such as "Alias for".
  # Ruff's D401 checks the verb form.
  "SS05",
]
exclude = [
  # Private objects and magic methods are not in the rendered API reference.
  '\._',
]
exclude_files = [
  # Tests need no docstrings.
  '^tests/',
  # A Typer command's docstring is its help text, and each parameter carries
  # its own help.
  '^src/.+/cli/',
]


[tool.repo-review]
ignore = [
  "PY007",  # Task runner: just is not one the check recognises
  "GH100",  # No GitHub Actions workflows by default
]
